---
name: Lint files
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Install RuboCop
        run: gem install rubocop

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint Ruby files
        run: rubocop

      - name: Lint YAML files
        run: yamllint .

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh lf/.config/lf/pv.sh

      # Uses Ubuntu's own fish package (4.2+ on 26.04) instead of the
      # fish-shell PPA, so the job doesn't depend on Launchpad being reachable.
      - name: Check fish syntax
        timeout-minutes: 5
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y fish
          fish_version=$(dpkg-query -W -f='${Version}' fish)
          echo "fish $fish_version"
          dpkg --compare-versions "$fish_version" ge 4.2 ||
            { echo "::error::fish $fish_version is older than 4.2"; exit 1; }
          # xargs fails if any file fails; find -exec ... \; would not.
          find fish -name '*.fish' -print0 | xargs -0 -n1 fish --no-execute
